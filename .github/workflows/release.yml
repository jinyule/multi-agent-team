name: Development release
on:
  workflow_dispatch:
    inputs:
      publish:
        type: boolean
        required: true
        default: false
        description: Publish the verified unsigned development prerelease after environment approval
permissions:
  contents: read
concurrency:
  group: development-release
  cancel-in-progress: false
jobs:
  candidate:
    runs-on: macos-15
    timeout-minutes: 35
    env:
      TEAM_QA_DIR: /tmp/multi-agent-team-qa
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.27.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Verify explicit version tag on main
        run: python3 scripts/release-preflight.py
      - run: npm --prefix desktop ci
      - run: make check package
      - run: python3 scripts/release.py verify
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-development-candidate
          path: |
            release/*.zip
            release/manifest.json
            release/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: release-evidence
          path: /tmp/multi-agent-team-qa
          if-no-files-found: error
          retention-days: 14
  publish:
    if: inputs.publish
    needs: candidate
    runs-on: macos-15
    timeout-minutes: 10
    environment: development-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Refuse publication without verified environment protection
        env:
          RELEASE_APPROVAL_CONFIGURED: ${{ vars.RELEASE_APPROVAL_CONFIGURED }}
        run: python3 scripts/release_approval.py
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-development-candidate
          path: release
      - name: Verify exact candidate without rebuilding
        run: python3 scripts/release.py verify
      - name: Publish verified development bytes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/publish-release.py
